name: Release plugin

on:
  push:
    tags:
      - "*"

env:
  PLUGIN_NAME: obsidian-wrapped

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Attest main.js
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "${{ github.workspace }}/main.js"

      - name: Attest styles.css
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "${{ github.workspace }}/styles.css"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            main.js manifest.json styles.css \
            --title "$VERSION" \
            --generate-notes